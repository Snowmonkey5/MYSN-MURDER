<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>MYSN MURDER</title>
  <meta name="theme-color" content="#1C9455" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      height: 100%; background: #0d1117; color: #e6edf3;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      overflow: hidden; touch-action: none; user-select: none;
    }
    #app { width: 100%; height: 100%; position: relative; }
    .screen {
      display: none; width: 100%; height: 100%;
      flex-direction: column; align-items: center; justify-content: center;
      padding: 20px 16px; text-align: center;
    }
    .screen.active { display: flex; }
    h1 {
      font-size: clamp(2rem, 8vw, 3.2rem); font-weight: 800;
      background: linear-gradient(135deg, #1C9455, #25c46e, #3dd68c);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }
    .subtitle { color: #8b949e; font-size: 0.95rem; margin-bottom: 28px; }
    input, button {
      font-size: 16px; border-radius: 12px; border: none;
      padding: 14px 18px; margin: 6px 0; width: min(300px, 92vw);
    }
    input {
      background: #21262d; color: #e6edf3; border: 1px solid #30363d; text-align: center;
    }
    input:focus { outline: 2px solid #1C9455; border-color: transparent; }
    button {
      background: linear-gradient(180deg, #25c46e, #1C9455); color: white;
      font-weight: 700; cursor: pointer; box-shadow: 0 4px 14px rgba(28,148,85,0.4);
    }
    button:active { transform: scale(0.97); }
    button.secondary { background: #30363d; box-shadow: none; }
    button.hostonly {
      background: linear-gradient(180deg, #2d9f6f, #1a7a4a);
      box-shadow: 0 4px 14px rgba(28,148,85,0.35);
    }
    .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; width: 100%; max-width: 320px; }
    #lobbyPlayers {
      display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
      max-width: 420px; margin: 18px 0; max-height: 180px; overflow-y: auto;
    }
    .player-chip {
      display: flex; align-items: center; gap: 8px;
      background: #21262d; padding: 8px 14px; border-radius: 24px;
      font-size: 0.9rem; border: 1px solid #30363d;
    }
    .color-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
    .code-big { font-size: 2.4rem; font-weight: 800; letter-spacing: 8px; color: #1C9455; margin: 8px 0 4px; }
    #gameScreen { padding: 0; }
    #gameWrapper { position: relative; width: 100%; height: 100%; overflow: hidden; background: #0d1117; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #hud {
      position: absolute; top: 0; left: 0; right: 0; padding: 12px;
      display: flex; justify-content: space-between; align-items: flex-start;
      pointer-events: none; z-index: 10; gap: 8px;
    }
    #hud > * { pointer-events: auto; }
    .hud-box {
      background: rgba(13,17,23,0.88); border: 1px solid #30363d;
      border-radius: 12px; padding: 10px 14px; font-size: 0.82rem;
    }
    #taskList { max-width: 160px; text-align: left; }
    .task-done { text-decoration: line-through; color: #1C9455; opacity: 0.9; }
    #mobileControls {
      position: absolute; bottom: 0; left: 0; right: 0; height: 190px;
      pointer-events: none; z-index: 20; display: none;
    }
    #mobileControls.visible { display: block; }
    #joystickZone { position: absolute; left: 18px; bottom: 28px; width: 128px; height: 128px; pointer-events: auto; }
    #joystickBase {
      width: 128px; height: 128px; border-radius: 50%;
      background: rgba(28,148,85,0.12); border: 2px solid rgba(28,148,85,0.35); position: relative;
    }
    #joystickKnob {
      width: 52px; height: 52px; border-radius: 50%; background: rgba(28,148,85,0.55);
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    }
    #actionButtons {
      position: absolute; right: 14px; bottom: 24px;
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px; pointer-events: auto;
    }
    .action-btn {
      width: 62px; height: 62px; border-radius: 50%; border: none;
      font-size: 11px; font-weight: 800; color: white;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 14px rgba(0,0,0,0.45);
    }
    #btnKill { background: #da3633; }
    #btnReport { background: #d29922; }
    #btnUse { background: #1C9455; }
    #btnMeeting { background: #238636; }
    #meetingOverlay, #roleReveal {
      position: absolute; inset: 0; background: rgba(0,0,0,0.92);
      display: none; flex-direction: column; align-items: center; justify-content: center;
      z-index: 50; padding: 20px;
    }
    #meetingOverlay.active, #roleReveal.active { display: flex; }
    #voteList { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-width: 380px; margin: 18px 0; }
    .vote-btn {
      background: #21262d; border: 2px solid #30363d; border-radius: 14px;
      padding: 12px 16px; color: white; font-size: 14px; cursor: pointer;
      display: flex; align-items: center; gap: 8px;
    }
    .vote-btn.selected { border-color: #1C9455; background: #15251c; }
    #roleText { font-size: clamp(2.2rem, 10vw, 3.5rem); font-weight: 900; margin: 12px 0; }
    #toast {
      position: absolute; top: 70px; left: 50%; transform: translateX(-50%);
      background: #1C9455; color: white; padding: 12px 22px; border-radius: 10px;
      font-weight: 700; display: none; z-index: 100; white-space: nowrap;
    }
    .slider-row {
      display: flex; align-items: center; gap: 12px; margin: 10px 0;
      width: min(280px, 90vw); justify-content: space-between;
    }
    .slider-row label { font-size: 0.9rem; color: #8b949e; }
    input[type=range] { width: 120px; accent-color: #1C9455; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="app">
    <div id="menuScreen" class="screen active">
      <h1>MYSN MURDER</h1>
      <p class="subtitle">Play from any phone • No computer needed</p>
      <input id="playerName" placeholder="Your name" maxlength="12" autocomplete="off" />
      <button id="btnCreate">Create & Play</button>
      <button id="btnCreateHost" class="hostonly">Create as Host Only</button>
      <div class="row" style="margin-top:14px">
        <input id="joinCode" placeholder="CODE" maxlength="4" style="width:110px; text-transform:uppercase; letter-spacing:3px" />
        <button id="btnJoin" class="secondary" style="width:auto; padding:14px 20px">Join</button>
      </div>
    </div>

    <div id="lobbyScreen" class="screen">
      <p style="color:#8b949e; font-size:0.9rem">Room Code</p>
      <div class="code-big" id="roomCodeDisplay">----</div>
      <p class="subtitle" id="shareInfo">Share this code with friends</p>
      <div id="lobbyPlayers"></div>
      <div id="hostControls" class="hidden">
        <div class="slider-row">
          <label>Bots</label>
          <span id="botCountLabel">3</span>
          <input type="range" id="botSlider" min="0" max="8" value="3" />
        </div>
        <div class="slider-row">
          <label>Impostors</label>
          <span id="impLabel">1</span>
          <input type="range" id="impSlider" min="1" max="3" value="1" />
        </div>
        <button id="btnStart" style="margin-top:18px">Start Game</button>
      </div>
      <p id="waitingText" class="subtitle">Waiting for host...</p>
      <p id="hostOnlyNote" class="subtitle hidden" style="color:#1C9455">You are Host Only – you will not play</p>
    </div>

    <div id="gameScreen" class="screen">
      <div id="gameWrapper">
        <canvas id="gameCanvas"></canvas>
        <div id="hud">
          <div class="hud-box" id="taskList">
            <strong style="color:#1C9455">Tasks</strong>
            <div id="tasksContent">—</div>
          </div>
          <div class="hud-box" id="roleBadge">Role: ???</div>
        </div>
        <div id="mobileControls">
          <div id="joystickZone">
            <div id="joystickBase"><div id="joystickKnob"></div></div>
          </div>
          <div id="actionButtons">
            <button class="action-btn" id="btnKill">KILL</button>
            <button class="action-btn" id="btnReport">REPORT</button>
            <button class="action-btn" id="btnUse">USE</button>
            <button class="action-btn" id="btnMeeting">MEET</button>
          </div>
        </div>
        <div id="meetingOverlay">
          <h2 id="meetingReason">Emergency Meeting</h2>
          <p id="meetingTimer" style="color:#8b949e">Discussion...</p>
          <div id="voteList"></div>
          <button id="btnSkip" class="secondary" style="width:auto; margin-top:8px">Skip Vote</button>
        </div>
        <div id="roleReveal">
          <p style="color:#8b949e">You are the</p>
          <div id="roleText">CREWMATE</div>
          <p id="roleDesc" style="color:#8b949e; max-width:280px">Complete tasks and find the murderer</p>
          <button id="btnRoleOk" style="margin-top:28px; width:auto">Got it</button>
        </div>
        <div id="toast"></div>
      </div>
    </div>

    <div id="endScreen" class="screen">
      <h1 id="endTitle">Victory</h1>
      <p id="endSubtitle" class="subtitle"></p>
      <div id="endPlayers" style="margin:20px 0; max-height:200px; overflow-y:auto"></div>
      <button id="btnBackMenu">Play Again</button>
    </div>
  </div>
  <script src="client.js"></script>
</body>
</html>
